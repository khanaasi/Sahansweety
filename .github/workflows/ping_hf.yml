name: Keep Hugging Face Alive (5 Min Ping)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-job:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          URL="https://asif123anime-mangajii.hf.space"
          echo "Pinging: $URL"
          STATUS=$(curl -sL -w "%{http_code}" -A "Mozilla/5.0" "$URL" -o /dev/null)
          echo "Status Code: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ SUCCESS: Space is Awake!"
          else
            echo "❌ ERROR: Status $STATUS"
            exit 1
          fi
